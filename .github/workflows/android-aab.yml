name: Android AAB

# Google Play Console 내부 테스트 트랙에 올릴 서명된 AAB(app-release.aab)를 자동 생성합니다.
# 결과물은 Actions → 해당 run → Artifacts 에서 다운로드해 Play Console 에 업로드하세요.
#   safenex-<ver>-<code>.aab          : Play에 올릴 번들 (매핑·네이티브 심볼 포함)
#   safenex-play-symbols-<ver>-<code> : mapping.txt + native-debug-symbols.zip
#     (이미 올린 버전은 App bundle explorer → 다운로드 → 가독화/기호 파일 업로드)
#
# 실행 방법 (Run workflow 버튼이 안 보일 때 포함)
#   A) Actions → "Android AAB" → Run workflow (본인 GitHub 로그인 + write 권한 필요)
#   B) 브랜치 build/android-aab 에 push → 자동 빌드 (버튼 불필요)
#   C) 태그 android-v1.0.1 등을 push → 자동 빌드 + Release 첨부
#
# ─ 필수 GitHub Secrets (Settings → Secrets and variables → Actions) ─────────────
#   ANDROID_KEYSTORE_BASE64   : *.jks 키스토어를 base64 로 인코딩한 문자열
#                               (Windows PowerShell)
#                                 [Convert]::ToBase64String([IO.File]::ReadAllBytes("safenex.jks")) | clip
#                               (macOS/Linux)
#                                 base64 -i safenex.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD : 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         : 키 alias (예: safenex)
#   ANDROID_KEY_PASSWORD      : 키 비밀번호
#   GOOGLE_SERVICES_JSON_BASE64 : Firebase google-services.json 의 base64 (FCM 필수)
#                                 또는 native-assets/fcm/google-services.json 커밋
# ─ 선택 ────────────────────────────────────────────────────────────────────────
#   ANDROID_VERSION_CODE      : 정수. 비우면 GitHub run number 사용 (자동 증가)
#   ANDROID_VERSION_NAME      : 예) 1.0.1. 비우면 package.json version 사용
# Play Console 「가독화 파일/디버그 기호 없음」: 이 워크플로가 R8 mapping + NDK
# SYMBOL_TABLE 을 AAB에 넣습니다. 이미 올린 467은 매핑이 그 DEX와 맞아야 해서
# 새 versionCode 로 다시 올리는 것이 맞습니다.
# ───────────────────────────────────────────────────────────────────────────────
#
# 키스토어 만드는 법 (1회):
#   keytool -genkey -v -keystore safenex.jks -alias safenex \
#     -keyalg RSA -keysize 2048 -validity 10000
#   → 생성된 safenex.jks 를 base64 로 변환해 Secret 에 등록.
#   → safenex.jks 원본은 안전한 곳(1Password, Bitwarden 등)에 보관. 절대 분실 금지.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (예: 1.0.1). 비우면 package.json 사용"
        required: false
        default: ""
      version_code:
        description: "versionCode (정수). 비우면 GitHub run number"
        required: false
        default: ""
  push:
    tags: ["android-v*"]
    # Run workflow 버튼이 안 보일 때: 이 브랜치로 push 하면 빌드 시작
    branches: ["build/android-aab"]

permissions:
  contents: write
  actions: write

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    # 태그/지정 브랜치/수동만 — 일반 PR·main push 의 빈 실패 방지
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/android-v') ||
      github.ref == 'refs/heads/build/android-aab'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Capacitor 8 / AGP 8.x templates compile with sourceCompatibility 21
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production web build
        env:
          CAP_DEV_URL: ""
        run: |
          # Optional overrides (only if Secrets are actually set — empty secrets must not wipe .env.production)
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
            export VITE_SUPABASE_PROJECT_ID="${{ secrets.VITE_SUPABASE_PROJECT_ID }}"
          fi
          if [ ! -f .env.production ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::Missing .env.production and VITE_SUPABASE_* secrets"
            exit 1
          fi
          bun run build

      - name: Guard — Supabase URL must be baked into dist
        run: |
          if ! grep -REq 'https://[a-z0-9]+\.supabase\.co' dist/assets; then
            echo "::error::dist is missing VITE_SUPABASE_URL. Commit .env.production or set GitHub Secrets."
            exit 1
          fi
          echo "OK: Supabase URL present in production bundle"

      - name: Add Android platform (불완전하면 재생성)
        run: |
          # android/ 일부 커스텀 파일만 git 추적됨 → 디렉터리는 있어도
          # build.gradle 이 없을 수 있음. 그때는 플랫폼을 다시 깐다.
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Incomplete android platform — regenerating while preserving custom sources"
            CUSTOM=$(mktemp -d)
            if [ -d android/app/src ]; then
              cp -a android/app/src "$CUSTOM/src"
            fi
            rm -rf android
            bunx cap add android
            if [ -d "$CUSTOM/src" ]; then
              cp -a "$CUSTOM/src/." android/app/src/
            fi
            # AlarmVolume 플러그인 등록 MainActivity (있으면 덮어씀)
            if [ -f capacitor-plugins/alarm-volume/MainActivity.java ]; then
              cp capacitor-plugins/alarm-volume/MainActivity.java \
                android/app/src/main/java/org/safenex/app/MainActivity.java
            fi
            if [ -f capacitor-plugins/alarm-volume/AlarmVolumePlugin.java ]; then
              cp capacitor-plugins/alarm-volume/AlarmVolumePlugin.java \
                android/app/src/main/java/org/safenex/app/AlarmVolumePlugin.java
            fi
            if [ -f capacitor-plugins/headless-track/HeadlessTrackPlugin.java ]; then
              cp capacitor-plugins/headless-track/HeadlessTrackPlugin.java \
                android/app/src/main/java/org/safenex/app/HeadlessTrackPlugin.java
              cp capacitor-plugins/headless-track/HeadlessTrackService.java \
                android/app/src/main/java/org/safenex/app/HeadlessTrackService.java
            fi
          fi
          bunx cap sync android
          # FCM google-services.json (required for push)
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
            echo "Wrote google-services.json from secret"
          elif [ -f native-assets/fcm/google-services.json ]; then
            cp native-assets/fcm/google-services.json android/app/google-services.json
            echo "Wrote google-services.json from native-assets"
          else
            echo "::error::Missing FCM google-services.json. Add Secret GOOGLE_SERVICES_JSON_BASE64 or commit native-assets/fcm/google-services.json — push is required for release AAB."
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("android/app/google-services.json"))
          pkgs=[c.get("client_info",{}).get("android_client_info",{}).get("package_name") for c in d.get("client",[])]
          print("FCM packages:", pkgs)
          if "org.safenex.app" not in pkgs:
              raise SystemExit("google-services.json has no client for org.safenex.app")
          PY
          # FCM custom sound (notification channel)
          mkdir -p android/app/src/main/res/raw
          if [ -f public/sounds/siren.wav ]; then
            cp public/sounds/siren.wav android/app/src/main/res/raw/siren.wav
            echo "Copied siren.wav → res/raw"
          else
            echo "::error::public/sounds/siren.wav missing — required for FCM alarm channel"
            exit 1
          fi
          if [ ! -f android/app/src/main/res/raw/siren.wav ]; then
            echo "::error::siren.wav not present under res/raw after copy"
            exit 1
          fi
          # 런처/알림 아이콘 + FCM default_notification_icon (항상 적용)
          pip install --quiet pillow
          python3 scripts/sync-android-brand-assets.py
          # AlarmVolume always re-applied (even when platform already exists)
          if [ -f capacitor-plugins/alarm-volume/MainActivity.java ]; then
            mkdir -p android/app/src/main/java/org/safenex/app
            cp capacitor-plugins/alarm-volume/MainActivity.java \
              android/app/src/main/java/org/safenex/app/MainActivity.java
          fi
          if [ -f capacitor-plugins/alarm-volume/AlarmVolumePlugin.java ]; then
            cp capacitor-plugins/alarm-volume/AlarmVolumePlugin.java \
              android/app/src/main/java/org/safenex/app/AlarmVolumePlugin.java
          fi
          bash capacitor-plugins/headless-track/install.sh || true
          if [ -f capacitor-plugins/headless-track/HeadlessTrackPlugin.java ]; then
            mkdir -p android/app/src/main/java/org/safenex/app
            cp capacitor-plugins/headless-track/HeadlessTrackPlugin.java \
              android/app/src/main/java/org/safenex/app/HeadlessTrackPlugin.java
            cp capacitor-plugins/headless-track/HeadlessTrackService.java \
              android/app/src/main/java/org/safenex/app/HeadlessTrackService.java
          fi
          # cap sync 템플릿에는 위치 권한이 없음 — 앱 AndroidManifest 에 주입
          node scripts/prepare-native.mjs
          node scripts/inject-android-manifest.mjs android/app/src/main/AndroidManifest.xml
          # Hard fail if critical permissions / plugins missing
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS CAMERA; do
            if ! grep -q "$p" "$MANIFEST"; then
              echo "::error::AndroidManifest missing $p after prepare-native"
              echo "----- AndroidManifest.xml -----"
              cat "$MANIFEST"
              exit 1
            fi
          done
          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            echo "::error::ML Kit barcode meta-data missing"
            exit 1
          fi
          if ! grep -q '@capacitor-mlkit/barcode-scanning' android/app/src/main/assets/capacitor.plugins.json; then
            echo "::error::ML Kit barcode plugin not synced into capacitor.plugins.json"
            exit 1
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::google-services.json missing after sync"
            exit 1
          fi
          echo "OK: native permissions + ML Kit + FCM + siren present"

      - name: Resolve version
        id: ver
        run: |
          VN="${{ github.event.inputs.version_name }}"
          [ -z "$VN" ] && VN="${{ secrets.ANDROID_VERSION_NAME }}"
          [ -z "$VN" ] && VN="$(node -p "require('./package.json').version || '1.0.0'")"
          VC="${{ github.event.inputs.version_code }}"
          [ -z "$VC" ] && VC="${{ secrets.ANDROID_VERSION_CODE }}"
          [ -z "$VC" ] && VC="${{ github.run_number }}"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "→ versionName=$VN  versionCode=$VC"

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret 이 비어 있습니다."
            exit 1
          fi
          mkdir -p android/app
          echo "$KS_B64" | base64 -d > android/app/release.jks
          echo "keystore decoded ($(wc -c < android/app/release.jks) bytes)"

      - name: Patch build.gradle (signing + versions + R8 호환)
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          GRADLE=android/app/build.gradle
          # proguard-android.txt → optimize 버전으로 (최신 AGP 호환)
          sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$GRADLE"
          # versionName / versionCode 치환
          sed -i "s/versionCode [0-9]\+/versionCode ${VC}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VN}\"/" "$GRADLE"
          # signingConfig 주입 (이미 있으면 skip)
          python3 scripts/patch-android-signing.py "$GRADLE"
          python3 scripts/patch-android-play-symbols.py "$GRADLE"
          # Capacitor + custom plugin keep rules (R8)
          if [ -f scripts/android-proguard-play.pro ]; then
            cat scripts/android-proguard-play.pro >> android/app/proguard-rules.pro
          fi
          echo "----- patched build.gradle -----"
          sed -n '1,120p' "$GRADLE"

      - name: Install NDK (Play native debug symbols)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Point Gradle at NDK
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          # Capacitor CI often has no local.properties — create/merge ndk.dir
          PROP=android/local.properties
          touch "$PROP"
          grep -q '^ndk.dir=' "$PROP" && sed -i "s|^ndk.dir=.*|ndk.dir=$NDK|" "$PROP" || echo "ndk.dir=$NDK" >> "$PROP"
          echo "NDK → $NDK"
          cat "$PROP"

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          ls -lh "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: safenex-${{ steps.ver.outputs.version_name }}-${{ steps.ver.outputs.version_code }}.aab
          path: ${{ steps.aab.outputs.path }}
          retention-days: 90

      - name: Collect Play mapping + native symbols
        run: |
          mkdir -p play-symbols
          MAP=$(find android/app/build/outputs/mapping -name mapping.txt 2>/dev/null | head -n1 || true)
          SYM=$(find android/app/build/outputs -name 'native-debug-symbols.zip' 2>/dev/null | head -n1 || true)
          if [ -n "$MAP" ]; then
            cp "$MAP" play-symbols/mapping.txt
            echo "mapping.txt → play-symbols ($(wc -c < play-symbols/mapping.txt) bytes)"
          else
            echo "::warning::mapping.txt not found — R8 may have been skipped"
          fi
          if [ -n "$SYM" ]; then
            cp "$SYM" play-symbols/native-debug-symbols.zip
            echo "native-debug-symbols.zip → play-symbols"
          else
            echo "::warning::native-debug-symbols.zip not beside AAB (AGP may have packed symbols into the bundle only)"
          fi
          ls -la play-symbols || true

      - name: Upload Play deobfuscation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: safenex-play-symbols-${{ steps.ver.outputs.version_name }}-${{ steps.ver.outputs.version_code }}
          path: play-symbols/*
          if-no-files-found: warn
          retention-days: 90

      - name: Attach to GitHub Release (android-v* 태그)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.aab.outputs.path }}
            play-symbols/*
          generate_release_notes: true
