name: Build SafeNex Vision Edge for Windows

on:
  workflow_dispatch:
  push:
    branches: [feat/vision-edge-gateway]
    paths:
      - "vision-edge/**"
      - ".github/workflows/build-vision-edge-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    env:
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
    defaults:
      run:
        shell: pwsh
        working-directory: vision-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: vision-edge/pyproject.toml

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --windowed --name SafeNexVisionEdge --collect-all vision_edge windows/desktop_entry.py

      - name: Materialize optional code-signing certificate
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "safenex-codesign.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "WINDOWS_CODESIGN_PFX_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign Windows application when a certificate is configured
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        run: |
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signTool sign /fd SHA256 /f $env:WINDOWS_CODESIGN_PFX_PATH /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\SafeNexVisionEdge\SafeNexVisionEdge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\SafeNexVisionEdge.iss

      - name: Sign installer when a certificate is configured
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        run: |
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $installer = Get-ChildItem -Path dist\windows\SafeNex_Vision_Edge_Setup_*_Windows_x64.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not found" }
          & $signTool sign /fd SHA256 /f $env:WINDOWS_CODESIGN_PFX_PATH /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNex-Vision-Edge-Setup-Windows-x64
          path: vision-edge/dist/windows/SafeNex_Vision_Edge_Setup_*_Windows_x64.exe
          if-no-files-found: error
          retention-days: 30
