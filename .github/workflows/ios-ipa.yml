name: iOS IPA

# Mac이 없는 상태에서 TestFlight로 올릴 서명된 IPA를 만듭니다.
# GitHub의 macOS 빌더에서만 실행됩니다. 일반 push·PR에서는 돌지 않습니다.
# macOS 분은 리눅스보다 많이 차감되므로, Actions에서 직접 실행할 때만 돌립니다.
#
# 실행
#   Actions → "iOS IPA" → Run workflow
#   또는 브랜치 cursor/ios-ipa-run-96eb 에 push (버튼 권한이 없을 때의 시작 방법)
#
# ─ 필수 GitHub Secrets (Settings → Secrets and variables → Actions) ─────────────
#   값은 채팅에 붙여 넣지 않습니다. .p8 과 인증서는 저장소에 커밋하지 않습니다.
#   APPLE_API_KEY_P8       : App Store Connect API 키 파일 전체 내용
#                            (-----BEGIN PRIVATE KEY----- 부터 END 줄까지)
#   APPLE_API_KEY_ID       : 키 ID (키 목록의 10자)
#   APPLE_API_ISSUER_ID    : 발행자 ID (통합 페이지 위쪽 UUID)
#   APPLE_TEAM_ID          : Apple Developer 멤버십의 팀 ID (10자)
# 키 권한은 관리(Admin)입니다. 앱 관리만으로는 서명 인증서를 만들지 못합니다.
# ───────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [cursor/ios-ipa-run-96eb]

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require Apple API secrets
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::GitHub Secret $name 이 비어 있습니다. 채팅에 키를 붙이지 말고 Settings → Secrets → Actions 에만 넣으세요."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$APPLE_API_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *)
              echo "::error::APPLE_API_KEY_P8 에 BEGIN PRIVATE KEY 줄이 없습니다. .p8 파일 전체를 시크릿에 넣으세요."
              exit 1
              ;;
          esac
          echo "Apple API secrets are present"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production web build
        env:
          CAP_DEV_URL: ""
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
            export VITE_SUPABASE_PROJECT_ID="${{ secrets.VITE_SUPABASE_PROJECT_ID }}"
          fi
          if [ ! -f .env.production ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::Missing .env.production and VITE_SUPABASE_* secrets"
            exit 1
          fi
          bun run build

      - name: Guard — Supabase URL must be baked into dist
        run: |
          if ! grep -REq 'https://[a-z0-9]+\.supabase\.co' dist/assets; then
            echo "::error::dist is missing VITE_SUPABASE_URL. Commit .env.production or set GitHub Secrets."
            exit 1
          fi
          echo "OK: Supabase URL present in production bundle"

      - name: Sync iOS project
        env:
          CAP_DEV_URL: ""
        run: |
          bunx cap sync ios
          node scripts/prepare-native.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("ios/App/App/capacitor.config.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          url = (data.get("server") or {}).get("url")
          if url:
              raise SystemExit(f"server.url is set ({url}). Unset CAP_DEV_URL and rebuild.")
          print("OK: no dev server url")
          PY

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          cp "$KEY" "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          cp "$KEY" "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          cp "$KEY" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "KEYPATH=$KEY" >> "$GITHUB_ENV"
          echo "Installed API key file (contents not printed)"

      - name: Archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Archive without a development profile. This team has no registered
          # device, so automatic development signing fails. App Store signing
          # happens in the export step and does not need a device.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Safenex.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Safenex.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYPATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::IPA was not exported"
            exit 1
          fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: safenex-ios-1.1.9-479.ipa
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if xcrun altool --help >/dev/null 2>&1; then
            xcrun altool --upload-app --type ios \
              --file "$IPA" \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER_ID"
          else
            xcrun iTMSTransporter -m upload \
              -assetFile "$IPA" \
              -apiKey "$APPLE_API_KEY_ID" \
              -apiIssuer "$APPLE_API_ISSUER_ID"
          fi
          echo "Upload requested. TestFlight processing continues on Apple's side."
