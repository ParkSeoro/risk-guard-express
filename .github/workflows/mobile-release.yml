name: Mobile Release (OTA bundle)

# 사용 방법
# ----------------------------------------------------------------
# 1) main 브랜치에 push → OTA 번들 자동 생성 + (시크릿 있으면) 자동 게시
# 2) Actions 탭 → "Run workflow" 로 버전을 수동 지정 가능
# 3) v* 태그 push → GitHub Releases 에도 zip 첨부
#
# 자동 게시(/settings/mobile-releases 등재)를 위해 필요한 GitHub Secrets:
#   - OTA_PUBLISH_URL    ★앱이 쓰는 프로젝트와 같아야 함
#                        예) https://qhntxmggacorqjjmjqgo.supabase.co/functions/v1/publish-ota-release
#                        (구 Lovable iqtiozsc… 로 올리면 폰 OTA가 영원히 빈 목록)
#   - OTA_PUBLISH_TOKEN  해당 프로젝트 Edge Secret OTA_PUBLISH_TOKEN 과 동일
#   - OTA_CHANNEL        기본 stable. beta 채널로 보내려면 beta
# 시크릿이 없으면 zip 만 Artifact 로 남기고 업로드 단계는 건너뜁니다.
# ----------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "OTA 번들 버전 (예: 1.0.1). 비우면 날짜 기반 자동 생성"
        required: false
        default: ""
      channel:
        description: "배포 채널 (stable / beta)"
        required: false
        default: "stable"
      mandatory:
        description: "필수 업데이트 여부 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-ota:
    name: Build web + OTA bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        env:
          CAP_DEV_URL: ""
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
            export VITE_SUPABASE_PROJECT_ID="${{ secrets.VITE_SUPABASE_PROJECT_ID }}"
          fi
          if [ ! -f .env.production ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::Missing .env.production and VITE_SUPABASE_* secrets"
            exit 1
          fi
          bun run build

      - name: Guard — Supabase URL must be baked into dist
        run: |
          if ! grep -REq 'https://[a-z0-9]+\.supabase\.co' dist/assets; then
            echo "::error::dist is missing VITE_SUPABASE_URL. Commit .env.production or set GitHub Secrets."
            exit 1
          fi
          echo "OK: Supabase URL present in production bundle"

      - name: Capacitor sync (있을 때만)
        run: |
          if [ -d "ios" ] || [ -d "android" ]; then
            bunx cap sync
          else
            echo "ios/, android/ 폴더 없음 → cap sync 건너뜀"
          fi

      - name: Resolve version & channel
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(node -p "require('./package.json').version || '0.0.0'")-$(date -u +%Y%m%d%H%M)"
          fi
          CH="${{ github.event.inputs.channel }}"
          [ -z "$CH" ] && CH="${{ secrets.OTA_CHANNEL }}"
          [ -z "$CH" ] && CH="stable"
          MAN="${{ github.event.inputs.mandatory }}"
          [ -z "$MAN" ] && MAN="false"
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "channel=$CH"  >> "$GITHUB_OUTPUT"
          echo "mandatory=$MAN" >> "$GITHUB_OUTPUT"
          echo "→ version=$V  channel=$CH  mandatory=$MAN"

      - name: Pack OTA zip
        run: node scripts/ota-bundle.mjs "${{ steps.ver.outputs.version }}"

      - name: SHA-256 체크섬
        run: |
          cd releases
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Publish to app_releases (Supabase Edge publish-ota-release)
        if: ${{ env.OTA_PUBLISH_URL != '' && env.OTA_PUBLISH_TOKEN != '' }}
        env:
          OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          MANDATORY: ${{ steps.ver.outputs.mandatory }}
          COMMIT: ${{ github.sha }}
        run: |
          ZIP=$(ls releases/safenex-*.zip | head -n1)
          echo "→ POST $OTA_PUBLISH_URL  (file=$ZIP)"
          # Guard: publish URL host should match .env.production (app bake-in)
          APP_HOST=$(node -e "const fs=require('fs');const t=fs.existsSync('.env.production')?fs.readFileSync('.env.production','utf8'):'';const m=t.match(/^VITE_SUPABASE_URL=(.*)$/m);try{console.log(new URL((m&&m[1]||'').trim().replace(/^[\"']|[\"']$/g,'')).host)}catch{console.log('')}")
          PUB_HOST=$(node -e "try{console.log(new URL(process.env.OTA_PUBLISH_URL||'').host)}catch{console.log('')}")
          echo "APP_HOST=$APP_HOST PUB_HOST=$PUB_HOST"
          if [ -n "$APP_HOST" ] && [ -n "$PUB_HOST" ] && [ "$APP_HOST" != "$PUB_HOST" ]; then
            echo "::error::OTA_PUBLISH_URL host ($PUB_HOST) ≠ app host ($APP_HOST). Phone will never see this release."
            exit 1
          fi
          # Custom secret in X-OTA-Publish-Token (and Authorization). Function must have verify_jwt=false.
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/ota-resp.json \
            -X POST "$OTA_PUBLISH_URL" \
            -H "Authorization: Bearer $OTA_PUBLISH_TOKEN" \
            -H "X-OTA-Publish-Token: $OTA_PUBLISH_TOKEN" \
            -H "Content-Type: application/zip" \
            -H "X-OTA-Version: $VERSION" \
            -H "X-OTA-Channel: $CHANNEL" \
            -H "X-OTA-Mandatory: $MANDATORY" \
            -H "X-OTA-Notes: CI publish from ${COMMIT:0:7}" \
            --data-binary "@$ZIP")
          echo "HTTP $HTTP"
          cat /tmp/ota-resp.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::OTA publish failed ($HTTP). If Invalid JWT: Dashboard → Edge Functions → publish-ota-release → Enforce JWT = OFF, then redeploy."
            exit 1
          fi

      - name: Skip notice when secrets missing
        if: ${{ env.OTA_PUBLISH_URL == '' || env.OTA_PUBLISH_TOKEN == '' }}
        env:
          OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
        run: |
          echo "::warning::OTA_PUBLISH_URL / OTA_PUBLISH_TOKEN GitHub Secrets 미설정 → 자동 게시 건너뜀."
          echo "마스터가 /settings/mobile-releases 에서 수동 업로드 가능."

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: safenex-ota-${{ steps.ver.outputs.version }}
          path: releases/*
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
