name: Vision Edge tests

on:
  pull_request:
    paths:
      - "vision-edge/**"
      - ".github/workflows/vision-edge-test.yml"
  push:
    branches: [main]
    paths:
      - "vision-edge/**"
      - ".github/workflows/vision-edge-test.yml"

jobs:
  pytest:
    name: vision-edge pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vision-edge/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: pytest
