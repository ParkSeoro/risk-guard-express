name: 그때살걸 자동 갱신
# 업비트 일봉은 한국시간 09:00에 바뀐다 → 09:10에 전일 종가 반영, 21:10에 현재가 갱신. 사람 개입 없이 24시간 운영.
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: geuttae
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 계산 테스트
        run: python -m unittest -q
      - name: 시세 갱신 + 사이트 생성 + 자가 진화
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python -m gl.build --out site
      - name: 시세·진화 상태 저장
        run: |
          git config user.name "geuttae-bot"
          git config user.email "geuttae-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 자동 갱신"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
