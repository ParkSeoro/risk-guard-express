project_id = "qhntxmggacorqjjmjqgo"

# 근로자 비밀번호 = 전화 뒤 4자리. 호스트 Auth 설정도 4로 맞춰야 한다.
[auth]
password_min_length = 4

[functions.setup-e2e-accounts]
verify_jwt = false

# Manual JWT verify + is_master RPC inside the function (service role Admin API).
[functions.admin-reset-password]
verify_jwt = false

# Manual JWT verify + project membership check; service role creates Auth users.
[functions.provision-worker-accounts]
verify_jwt = false

# CI uses a shared secret (not a user JWT). Gateway JWT check must be off.
[functions.publish-ota-release]
verify_jwt = false

# DB pg_net trigger sends only X-Push-Trigger-Secret (no Authorization JWT).
[functions.dispatch-notification-push]
verify_jwt = false

# Gateway QR start / kit claim are device calls without a user JWT. Auth is inside the function.
[functions.vision-fleet]
verify_jwt = false
