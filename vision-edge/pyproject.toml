[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safenex-vision-edge"
version = "0.3.0"
description = "SafeNex 현장 NVR·AI CCTV용 보안 Edge Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<51",
  "pydantic>=2.6,<3",
  "qrcode>=8.0,<9",
]

[project.optional-dependencies]
windows = [
  "pywebview>=5.0,<7",
]
test = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
vision-edge = "vision_edge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_edge = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.coverage.run]
source = ["vision_edge"]
branch = true
