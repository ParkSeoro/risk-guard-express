services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8088:8088"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp/hls:rw,size=512M

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - nginx-rtmp
    ports:
      - "80:80"
      - "443:443"
    environment:
      HLS_HOST: ${HLS_HOST:?set HLS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
