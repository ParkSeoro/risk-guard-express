services:
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
  viewer-gate:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/viewer_gate.py"]
    depends_on:
      - mediamtx
    environment:
      MTX_API: http://mediamtx:9997
    volumes:
      - ./viewer_gate.py:/viewer_gate.py:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "80:80"
      - "443:443"
    environment:
      HLS_HOST: ${HLS_HOST:?set HLS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
