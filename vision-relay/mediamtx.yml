logLevel: info
readTimeout: 60s
writeTimeout: 60s
rtmp: yes
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: mpegts
# The camera's timestamps move slowly. One second never closes a file.
hlsSegmentDuration: 200ms
# Caddy sends this so Windows does not get stuck on the cookie check.
hlsCDNSecret: safenexhls
rtmpAddress: :1935
pathDefaults:
  source: publisher
# v1.21 does not open a path from pathDefaults alone.
# Keys are 8 random bytes (16 hex chars) under live/.
paths:
  "~^live/[0-9a-f]{16}$":
    source: publisher
