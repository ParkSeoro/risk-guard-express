logLevel: info
readTimeout: 60s
writeTimeout: 60s
rtmp: yes
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Remux only while a browser is reading. An always-on muxer looks like a viewer
# and would keep 4G cameras uploading overnight.
hlsAlwaysRemux: no
api: yes
apiAddress: :9997
rtmpAddress: :1935
pathDefaults:
  source: publisher
# v1.21 applies pathDefaults only to paths listed here.
# all_others is the stock catch-all, so every camera key can publish.
paths:
  all_others:
