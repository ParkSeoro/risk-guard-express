logLevel: info
readTimeout: 60s
writeTimeout: 60s
rtmp: yes
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: mpegts
# One second is the target. The camera keyframe interval decides the real length.
# G.711 audio is left out of HLS. The browser receives H.264 only.
hlsSegmentDuration: 1s
rtmpAddress: :1935
pathDefaults:
  source: publisher
# v1.21 does not open a path from pathDefaults alone.
# Keys are 8 random bytes (16 hex chars) under live/.
paths:
  "~^live/[0-9a-f]{16}$":
    source: publisher
