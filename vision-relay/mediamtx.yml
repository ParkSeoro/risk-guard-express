logLevel: info
rtmp: yes
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Sydney relay: low-latency HLS (1s segments, 200ms parts), ready before a viewer joins.
# G.711 is skipped. The browser receives H.264 only.
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
rtmpAddress: :1935
webrtc: no
pathDefaults:
  source: publisher
# v1.21 does not open a path from pathDefaults alone.
# Keys are 8 random bytes (16 hex chars) under live/.
paths:
  "~^live/[0-9a-f]{16}$":
    source: publisher
