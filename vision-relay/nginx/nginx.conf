worker_processes 1;
error_log /var/log/nginx/error.log info;
events { worker_connections 1024; }
rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      meta copy;
      wait_key off;
      drop_idle_publisher 24h;
      on_publish http://127.0.0.1:8099/publish;
    }
  }
}
http {
  server {
    listen 127.0.0.1:8088;
    listen 172.18.0.1:8088;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }
    location /control {
      rtmp_control all;
    }
    location /live/_raw/ {
      deny all;
    }
    location /live/ {
      alias /tmp/hls/;
      add_header Cache-Control no-cache;
    }
  }
}
