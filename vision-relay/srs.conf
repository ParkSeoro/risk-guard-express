listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;
    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }
    publish {
        mr              off;
        firstpkt_timeout 20000;
        normal_timeout  15000;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled             on;
        hls_path            ./objs/nginx/html;
        hls_fragment        1;
        hls_window          7;
        hls_wait_keyframe   on;
        hls_cleanup         on;
        hls_dispose         15;
        hls_m3u8_file       [app]/[stream]/index.m3u8;
        hls_ts_file         [app]/[stream]/[seq].ts;
        hls_acodec          an;
    }
}
